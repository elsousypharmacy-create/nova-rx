<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Rx | WhatsApp</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0b141a;--pane:#111b21;--top:#202c33;--line:#2a3942;--text:#e9edef;--muted:#8696a0;--green:#00a884}*{box-sizing:border-box}body{margin:0;background:#0a1014;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #53bdeb;outline-offset:2px}.shell{display:grid;grid-template-columns:380px minmax(0,1fr);height:100dvh;max-width:1700px;margin:auto;border-inline:1px solid var(--line)}aside{background:var(--pane);border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column}.toolbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--top);gap:12px}.brand{font-weight:800;letter-spacing:.2px}.brand span{color:var(--green)}.sub{font-size:11px;color:var(--muted)}.search{padding:12px;border-bottom:1px solid var(--line)}input,textarea{border:0;background:#202c33;color:var(--text);border-radius:9px;padding:12px;width:100%}input::placeholder,textarea::placeholder{color:#8696a0}.filters{display:flex;gap:8px;padding:0 12px 12px}.chip{border:0;border-radius:18px;padding:7px 12px;background:#202c33;color:#c6d1d6;font-size:12px}.chip.active{background:#103c33;color:#75d6b7}.chats{overflow:auto;flex:1}.chat{display:flex;gap:12px;padding:15px 14px;border:0;border-bottom:1px solid #202d33;background:transparent;color:inherit;width:100%;text-align:right}.chat:hover,.chat.selected{background:#202c33}.avatar{width:45px;height:45px;flex:0 0 45px;border-radius:50%;display:grid;place-items:center;background:#36505a;color:#fff;font-weight:700}.chatmain{flex:1;min-width:0}.chatline{display:flex;justify-content:space-between;gap:8px}.chatname{font-weight:650}.time,.preview{color:var(--muted);font-size:12px}.preview{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:6px}.count{background:var(--green);color:#09251e;border-radius:30px;padding:1px 6px;font-size:11px}.conversation{display:flex;flex-direction:column;min-width:0;background-color:#0b141a;background-image:radial-gradient(#17252d 1px,transparent 1px);background-size:24px 24px}.header{height:68px;background:var(--top);display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}.headertext{flex:1;min-width:0}.headertext strong,.headertext small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headertext small{color:var(--muted);font-size:12px;margin-top:3px}.action{border:1px solid #42605a;color:#b6f1df;background:#15362f;border-radius:8px;padding:8px 10px;font-size:12px}.back{display:none}.messages{flex:1;overflow:auto;padding:24px 7%;display:flex;flex-direction:column;gap:8px}.bubble{max-width:min(72%,530px);padding:9px 11px;border-radius:9px;line-height:1.6;overflow-wrap:anywhere;box-shadow:0 1px 1px #0003}.bubble.in{background:#202c33;align-self:flex-start;border-top-right-radius:2px}.bubble.out{background:#005c4b;align-self:flex-end;border-top-left-radius:2px}.bubble .meta{display:block;color:#aab7b7;text-align:left;font-size:10px;margin-top:3px}.day{align-self:center;background:#18272f;padding:5px 12px;border-radius:8px;color:#b2bec4;font-size:12px;margin:10px}.composer{display:flex;gap:10px;align-items:end;background:var(--top);padding:12px 18px}.composer textarea{resize:none;min-height:44px;max-height:130px}.send{border:0;background:var(--green);color:#06241d;border-radius:50%;height:44px;width:44px;flex-shrink:0;font-size:22px}.empty{display:grid;place-content:center;place-items:center;flex:1;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text)}.notice{background:#28322c;color:#d5d9ca;font-size:12px;text-align:center;padding:7px}.hidden{display:none!important}.tag{color:#77d9ba;font-size:11px}.muted{color:var(--muted)}@media(max-width:760px){.shell{display:block}.shell aside,.shell .conversation{height:100dvh}.shell.mobile-open aside{display:none}.shell:not(.mobile-open) .conversation{display:none}.back{display:inline-flex}.toolbar{height:62px}.messages{padding:15px 4%}.bubble{max-width:85%}.header{padding:8px}.action{font-size:11px}}
</style></head><body><div class="shell" id="shell">
<aside><div class="toolbar"><div><div class="brand">NOVA <span>Rx</span> · واتساب</div><div class="sub">صندوق المحادثات</div></div><span class="tag">وضع تجريبي</span></div><div class="search"><input id="search" aria-label="بحث في المحادثات" placeholder="ابحث عن اسم أو رسالة"></div><div class="filters" id="filters"><button class="chip active" data-filter="all">الكل</button><button class="chip" data-filter="unread">غير مقروء</button><button class="chip" data-filter="human">مع الموظف</button><button class="chip" data-filter="bot">مع البوت</button></div><div class="chats" id="chats"></div></aside>
<section class="conversation"><div id="empty" class="empty"><div style="font-size:42px">◉</div><h2>محادثات واتساب</h2><p>اختار محادثة من القائمة للعرض</p><p class="sub">بيانات توضيحية فقط — غير متصل بالبوت الحقيقي</p></div><div id="active" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="header"><button class="action back" id="back" aria-label="الرجوع للمحادثات">رجوع</button><div class="avatar" id="avatar">م</div><div class="headertext"><strong id="contact"></strong><small id="status"></small></div><button class="action" id="takeover"></button></div><div class="notice">معاينة فقط — لن تُرسل أي رسالة حقيقية</div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="composer" id="compose"><textarea id="draft" aria-label="اكتب رسالة" rows="1" placeholder="اكتب رسالة تجريبية..."></textarea><button class="send" aria-label="إضافة رسالة تجريبية" title="إضافة رسالة تجريبية">➤</button></form></div></section></div>
<script>
'use strict';
// UI demo only. No credentials, live requests, customer data, or webhook mutations.
const fixtures=[{id:'demo1',name:'عميل تجريبي ١',unread:2,owner:'bot',messages:[{side:'in',text:'مساء الخير، الدواء متوفر؟',time:'١٢:٤٠'},{side:'out',text:'أهلًا بحضرتك، ابعت اسم الدواء من فضلك.',time:'١٢:٤١'}]},{id:'demo2',name:'عميلة تجريبية ٢',unread:0,owner:'human',messages:[{side:'in',text:'بعت صورة الروشتة وعايزة أراجعها مع الصيدلي 📎',time:'١١:١٥'},{side:'out',text:'الصيدلي هيراجعها ويرد على حضرتك.',time:'١١:٢٠'}]},{id:'demo3',name:'عميل تجريبي ٣',unread:1,owner:'bot',messages:[{side:'in',text:'ممكن أعرف مواعيد العمل؟',time:'١٠:٠٥'}]}];
const $=id=>document.getElementById(id);let selected=null,filter='all',query='';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderList(){const items=fixtures.filter(c=>(filter==='all'||(filter==='unread'&&c.unread>0)||c.owner===filter)&&[c.name,...c.messages.map(m=>m.text)].join(' ').toLowerCase().includes(query));$('chats').innerHTML=items.length?items.map(c=>'<button class="chat '+(selected===c.id?'selected':'')+'" data-id="'+c.id+'"><span class="avatar">'+safe(c.name[0])+'</span><span class="chatmain"><span class="chatline"><span class="chatname">'+safe(c.name)+'</span><span class="time">'+safe(c.messages.at(-1)?.time||'')+'</span></span><div class="preview">'+safe(c.messages.at(-1)?.text||'')+'</div><span class="tag">'+(c.owner==='human'?'الموظف':'البوت')+'</span> '+(c.unread?'<span class="count">'+c.unread+'</span>':'')+'</span></button>').join(''):'<div class="empty"><p>مفيش محادثات مطابقة</p></div>';$('chats').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openChat(b.dataset.id))}
function openChat(id){selected=id;const c=fixtures.find(x=>x.id===id);if(!c)return;c.unread=0;$('shell').classList.add('mobile-open');$('empty').classList.add('hidden');$('active').classList.remove('hidden');$('contact').textContent=c.name;$('avatar').textContent=c.name[0];$('status').textContent=c.owner==='human'?'الموظف مستلم المحادثة':'البوت مسؤول عن المحادثة';$('takeover').textContent=c.owner==='human'?'إرجاع للبوت':'استلام المحادثة';$('messages').innerHTML='<div class="day">اليوم · تجربة</div>'+c.messages.map(m=>'<div class="bubble '+m.side+'"><div dir="auto">'+safe(m.text)+'</div><span class="meta">'+safe(m.time)+(m.side==='out'?' ✓✓':'')+'</span></div>').join('');$('messages').scrollTop=$('messages').scrollHeight;renderList()}
$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();renderList()});$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('filters').querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('back').onclick=()=>{$('shell').classList.remove('mobile-open')};$('takeover').onclick=()=>{const c=fixtures.find(x=>x.id===selected);if(!c)return;c.owner=c.owner==='bot'?'human':'bot';openChat(selected)};$('compose').onsubmit=e=>{e.preventDefault();const val=$('draft').value.trim();if(!selected||!val)return;fixtures.find(x=>x.id===selected).messages.push({side:'out',text:val,time:new Intl.DateTimeFormat('ar-EG',{hour:'2-digit',minute:'2-digit'}).format(new Date())});$('draft').value='';openChat(selected)};renderList();
</script></body></html>
