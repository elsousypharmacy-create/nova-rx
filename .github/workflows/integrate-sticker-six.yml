name: Integrate Sticker Studio six-label layout
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sticker-six-pager-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch existing standalone Sticker Studio
        run: echo 'HTML integrated directly; do not reapply patch'
      - name: Syntax and targeted static checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('sticker-studio.html').read_text()
          for x in ['stickerPageCount','pregnancy','breastfeeding','ageUnit','sticker-six-layout.css','stickerPage*6']:
            assert x in s,x
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/sticker-six-check.js').write_text(js)
          PY
          node --check /tmp/sticker-six-check.js
      - name: Commit integration on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sticker-studio.html
          if ! git diff --cached --quiet; then
            git commit -m "feat(stickers): integrate six-label single-screen controls"
            git push
          fi
