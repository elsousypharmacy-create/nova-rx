name: Purchasing page checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['index.html', 'receipt-operations.js', 'purchase-orders.js', 'stock-ledger.js', 'purchases*', 'supplier-lookup.*', 'supplier-provider.js', 'worker/procurement/**', 'tests/*purchases*', 'tests/ux/receiving*.mjs', 'tests/unit/receipt-operations.check.cjs', 'tests/unit/purchases*', '.github/workflows/purchasing-checks.yml', '.github/actions/setup-playwright/**', '.github/scripts/retry.sh']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tests/unit/module-worker.check.mjs
      - run: python3 tests/unit/worker-download-content.check.py
      - run: bash -n .github/scripts/deploy_worker.sh
      - run: node tests/unit/supplier-cart-client.check.mjs
      - run: node tests/unit/supplier-journal.check.mjs
      - run: node tests/unit/supplier-transactions.check.mjs
      - run: node tests/unit/supplier-platform.check.mjs
      - run: node tests/unit/purchases.check.mjs
      - run: node tests/unit/purchases-shortages.check.mjs
      - run: node tests/unit/purchases-speed.check.mjs
      - run: node tests/unit/purchases-prep.check.mjs
      - run: node tests/unit/purchases-compare.check.mjs
      - run: node tests/unit/purchases-seller-scope.check.mjs
      - name: Setup Playwright and cached Chromium
        uses: ./.github/actions/setup-playwright
        with:
          packages: 'playwright@1.58.2'
          playwright-version: '1.58.2'
      - name: Serve static files locally (port 8766)
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/nova-http-8766.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/nova-http-8766.log || true
          exit 1
      - run: node tests/purchases-browser.mjs
      - run: node tests/supplier-orders-browser.mjs
      - run: node tests/purchases-seller-search-browser.mjs
      - run: node tests/purchases-ux-browser.mjs
      - run: node tests/purchases-compare-browser.mjs
      - run: node tests/unit/purchase-orders.check.mjs
      - run: node tests/unit/receipt-operations.check.cjs
      - run: node tests/purchases-po-browser.mjs
      - name: Local purchase order through receiving and stock
        run: NOVA_RECEIVING_URL=http://127.0.0.1:8766 node tests/ux/receiving-resume.mjs
      - name: Prepare receiving comparison baseline
        run: |
          bash .github/scripts/retry.sh 3 5 -- git fetch --depth=1 origin main
          git show FETCH_HEAD:index.html > receipt-before.html
      - name: Receiving review, corrections and remaining quantities
        run: NOVA_RECEIVING_URL=http://127.0.0.1:8766 node tests/ux/receiving-controls.mjs
      - run: node tests/ui-buy03-supplier-split.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchasing-ui-evidence
          path: |
            reports/purchasing/
            reports/receiving/
