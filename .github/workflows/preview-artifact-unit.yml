# Unit-check the newest preview Worker artifact. No network, no deploy, never prints secrets.
name: Preview artifact unit checks

on:
  pull_request:
    paths:
      - "worker/live/**"
      - "index.html"
      - "sw.js"
      - "tools/build-worker-artifact.mjs"
      - "tests/unit/artifact-ux406*.check.mjs"
      - "tests/unit/artifact-ux407*.check.mjs"
      - "tests/unit/ux430-*-artifact.check.mjs"
      - ".github/workflows/preview-artifact-unit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check ux-407 artifact (flag-gated KPIs + UX404/405/406/407)
        run: node --no-warnings tests/unit/artifact-ux407.check.mjs
