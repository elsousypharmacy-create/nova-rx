# Manual one-task trial: run Claude Code (Sonnet only) on a GitHub-hosted
# runner so work continues when the local box sleeps.
# Auth: Claude Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`). Do not use a billed Anthropic API key.
# This workflow does nothing until someone starts it with workflow_dispatch
# and the secret is set. It never deploys and never merges.
name: Cloud agent task (Claude Sonnet)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task id (branch will be cloud/<task_id>), e.g. N32"
        required: true
        type: string
      brief:
        description: "Task brief and acceptance criteria"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cloud-agent-task
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs and secret
        env:
          TASK_ID: ${{ inputs.task_id }}
          BRIEF: ${{ inputs.brief }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set repository secret CLAUDE_CODE_OAUTH_TOKEN from \`claude setup-token\` (Claude Pro/Max). Do not use a billed Anthropic API key."
            exit 1
          fi
          echo "$TASK_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' || {
            echo "::error::task_id must be 1-64 characters: letters, digits, dot, underscore, hyphen"
            exit 1
          }
          [ -n "$BRIEF" ] || { echo "::error::brief is required"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create isolated branch
        id: branch
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BRANCH="cloud/${TASK_ID}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin. Pick a new task_id or delete the old branch first."
            exit 1
          fi
          git switch -c "$BRANCH" origin/main
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Implement with Claude Sonnet
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: main
          show_full_output: true
          prompt: |
            You are implementing one NOVA Rx task on branch ${{ steps.branch.outputs.branch }}.

            Task id: ${{ inputs.task_id }}
            Brief:
            ${{ inputs.brief }}

            Rules:
            - Do exactly this brief's scope. Do not start other tasks.
            - Stay on branch ${{ steps.branch.outputs.branch }}. Commit and push there. Open a pull request into main titled "[${{ inputs.task_id }}] <short summary>" whose body lists changed files, tests run and exact results, and remaining work. Never claim untested success.
            - The model is already pinned to Sonnet. Do not switch to Opus or any other model.
            - Do not edit .github/workflows, secrets, env files, or node_modules. Do not deploy. Do not merge. Do not call paid APIs or supplier live sites. Do not print secrets.
            - If you touch UI, preserve Black Edition Arabic RTL UX.
            - Run the tests the brief names, or the nearest existing unit tests for the files you change, and record exact results.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash

      - name: Open draft PR if Claude did not
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          [ -n "${BRANCH:-}" ] || exit 0
          git fetch origin "$BRANCH" || true
          if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
            if [ -n "$(git log origin/main.."$BRANCH" --oneline 2>/dev/null || true)" ]; then
              git push -u origin "$BRANCH" || true
            fi
          fi
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH was not pushed; skipping PR."
            exit 0
          fi
          AHEAD=$(git rev-list --count origin/main..origin/"$BRANCH" || echo 0)
          if [ "$AHEAD" = "0" ]; then
            echo "No commits on $BRANCH ahead of main; skipping PR."
            exit 0
          fi
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url'
            exit 0
          fi
          if ! gh pr create --draft --base main --head "$BRANCH" \
            --title "[${TASK_ID}] cloud agent task" \
            --body "Implements ${TASK_ID} via GitHub Actions (Claude Sonnet). Review before merge. Do not auto-deploy."; then
            echo "::warning::Commits are on $BRANCH but PR creation failed. Open a draft PR manually."
          fi
