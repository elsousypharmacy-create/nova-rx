# Run one Claude Code (Sonnet only) task on a GitHub-hosted runner so work
# continues when the local box sleeps. Started by cloud-scheduler.yml (or by
# hand). Slot A uses CLAUDE_CODE_OAUTH_TOKEN_A (fallback CLAUDE_CODE_OAUTH_TOKEN),
# slot B uses CLAUDE_CODE_OAUTH_TOKEN_B. The scheduler opens/merges the PR.
# Auth: Claude Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`). Do not use a billed Anthropic API key.
# It never deploys and never merges.
name: Cloud agent task (Claude Sonnet)
run-name: cloud ${{ inputs.task_id }} ${{ inputs.mode }} ${{ inputs.slot }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task id (branch will be cloud/<task_id>), e.g. N32"
        required: true
        type: string
      brief:
        description: "Task brief and acceptance criteria"
        required: true
        type: string
      mode:
        description: "new = implement the task; fix = fix CI/conflicts on the existing branch"
        required: false
        default: new
        type: choice
        options: [new, fix]
      slot:
        description: "Claude account slot (A or B)"
        required: false
        default: A
        type: choice
        options: [A, B]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: cloud-agent-task-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs and secret
        env:
          TASK_ID: ${{ inputs.task_id }}
          BRIEF: ${{ inputs.brief }}
          SLOT: ${{ inputs.slot }}
          TOK_A: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_A || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOK_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
        run: |
          set -euo pipefail
          if { [ "$SLOT" = "B" ] && [ -z "$TOK_B" ]; } || { [ "$SLOT" != "B" ] && [ -z "$TOK_A" ]; }; then
            echo "::error::Missing Claude OAuth token secret for slot $SLOT (from \`claude setup-token\`, Claude Pro/Max). Do not use a billed Anthropic API key."
            exit 1
          fi
          echo "$TASK_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' || {
            echo "::error::task_id must be 1-64 characters: letters, digits, dot, underscore, hyphen"
            exit 1
          }
          [ -n "$BRIEF" ] || { echo "::error::brief is required"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare task branch
        id: branch
        env:
          TASK_ID: ${{ inputs.task_id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BRANCH="cloud/${TASK_ID}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" "origin/$BRANCH"
          elif [ "$MODE" = "fix" ]; then
            echo "::error::fix mode needs existing branch $BRANCH"; exit 1
          else
            git switch -c "$BRANCH" origin/main
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Implement with Claude Sonnet
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ inputs.slot == 'B' && secrets.CLAUDE_CODE_OAUTH_TOKEN_B || secrets.CLAUDE_CODE_OAUTH_TOKEN_A || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          base_branch: main
          show_full_output: true
          prompt: |
            You are implementing one NOVA Rx task on branch ${{ steps.branch.outputs.branch }}.

            Task id: ${{ inputs.task_id }} (mode: ${{ inputs.mode }})
            Brief:
            ${{ inputs.brief }}

            Rules:
            - Do exactly this brief's scope. Do not start other tasks.
            - Stay on branch ${{ steps.branch.outputs.branch }}. Commit and push there (git push origin HEAD). Do NOT open a pull request: the cloud scheduler opens it, runs CI and merges on green. Put changed files, exact test commands and results, and remaining work in your final commit message. Never claim untested success.
            - If the branch already has commits (retry or fix mode), continue from them; in fix mode fix only what the brief says failed.
            - The model is already pinned to Sonnet. Do not switch to Opus or any other model.
            - Do not edit .nova/cloud-queue.json or .github/workflows, secrets, env files, or node_modules. Do not deploy. Do not merge. Do not call paid APIs or supplier live sites. Do not print secrets.
            - If you touch UI, preserve Black Edition Arabic RTL UX.
            - Run the tests the brief names, or the nearest existing unit tests for the files you change, and record exact results.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash

      - name: Push leftover commits and wake the scheduler
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -uo pipefail
          if [ -n "${BRANCH:-}" ] && [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
            git push origin "HEAD:$BRANCH" || echo "::warning::push failed"
          fi
          gh workflow run cloud-scheduler.yml --ref main || echo "::warning::could not dispatch cloud-scheduler"
