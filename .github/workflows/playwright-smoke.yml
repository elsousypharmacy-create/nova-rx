name: Playwright POS smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'auth-*.js'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/playwright-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'auth-*.js'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/playwright-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Pin OS: Playwright 1.58.2 cannot install Chromium deps on ubuntu26.04-x64
    # (what ubuntu-latest currently resolves to on GitHub Actions).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static demo locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run isolated demo smoke test
        run: npx playwright test tests/nova-pos-smoke.spec.cjs --browser=chromium --reporter=line,html
      - name: Run real-catalog UI checks (endpoint answered from the committed snapshot, no backend)
        run: node tests/ui-real-catalog.mjs
      - name: UI sales ledger (U1)
        run: node tests/ui-sales-ledger.mjs
      - name: POS-02 atomic invoice and payment (N35)
        run: node tests/ui-pos02-payment.mjs
      - name: UI returns (U2)
        run: node tests/ui-returns.mjs
      - name: UI products packaging (N05, runs once the test is on the branch)
        run: |
          if [ -f tests/ui-products-packaging.mjs ]; then node tests/ui-products-packaging.mjs; else echo "tests/ui-products-packaging.mjs not present yet, skipped"; fi
      - name: Sale sticker modal (N01)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/sale-sticker-modal.mjs
      - name: INV-03 reservation, last unit cannot sell twice (N24)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-inv03-reservation.mjs
      - name: INV-02 lots and expiry, FEFO + block expired (N18)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-inv02-lots-expiry.mjs
      - name: INV-05 branch transfers and lot recall (N33)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-inv05-transfers-recall.mjs
      - name: SEC-01 accounts and sessions (N45)
        run: |
          node tests/unit/auth-local.check.mjs
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-sec01-accounts.mjs
      - name: SEC-02 permissions matrix (N46)
        run: |
          node tests/unit/auth-permissions.check.mjs
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-sec02-permissions.mjs
      - name: POS-04 returns and cancellation (N37)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-pos04-returns-cancel.mjs
      - name: POS-05 receipt PDF and printer/scanner (N38)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-pos05-receipt-scanner.mjs
      - name: Catalog duplicate detection (N21)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-catalog-duplicates.mjs
      - name: CAT-02 units and conversion (N19)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-cat02-units.mjs
      - name: CAT-05 instant search UI and 5000-item perf check (N17)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-cat05-instant-search.mjs
      - name: BUY-03 supplier selection and split (N28)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/ui-buy03-supplier-split.mjs
      - name: Write machine-readable result
        if: always()
        run: |
          mkdir -p qa/reports
          echo '{"task":"NOVA-PLAYWRIGHT-SMOKE","commit":"${{ github.sha }}","run_id":"${{ github.run_id }}","conclusion":"${{ job.status }}"}' > qa/reports/playwright-result.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-playwright-report
          path: |
            playwright-report/
            test-results/
            qa/reports/playwright-result.json
          if-no-files-found: ignore
          retention-days: 14
