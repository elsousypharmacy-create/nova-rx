name: Playwright POS smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/playwright-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/playwright-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Pin OS: Playwright 1.58.2 cannot install Chromium deps on ubuntu26.04-x64
    # (what ubuntu-latest currently resolves to on GitHub Actions).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static demo locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run isolated demo smoke test
        run: npx playwright test tests/nova-pos-smoke.spec.cjs --browser=chromium --reporter=line,html
      - name: Run real-catalog UI checks (endpoint answered from the committed snapshot, no backend)
        run: node tests/ui-real-catalog.mjs
      - name: UI sales ledger (U1)
        run: node tests/ui-sales-ledger.mjs
      - name: UI returns (U2)
        run: node tests/ui-returns.mjs
      - name: UI products packaging (N05)
        run: node tests/ui-products-packaging.mjs
      - name: Write machine-readable result
        if: always()
        run: |
          mkdir -p qa/reports
          echo '{"task":"NOVA-PLAYWRIGHT-SMOKE","commit":"${{ github.sha }}","run_id":"${{ github.run_id }}","conclusion":"${{ job.status }}"}' > qa/reports/playwright-result.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-playwright-report
          path: |
            playwright-report/
            test-results/
            qa/reports/playwright-result.json
          if-no-files-found: ignore
          retention-days: 14
