name: Stock ledger unit checks

on:
  pull_request:
    paths:
      - 'stock-ledger.js'
      - 'tests/unit/stock-ledger.check.mjs'
      - '.github/workflows/pricing-unit.yml'
  push:
    branches: [main]
    paths:
      - 'stock-ledger.js'
      - 'tests/unit/stock-ledger.check.mjs'
      - '.github/workflows/pricing-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stock ledger checks (no dependencies, no network)
        run: node --no-warnings tests/unit/stock-ledger.check.mjs
