name: Kimi NOVA Rx task
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Approved GitHub issue number"
        required: true
        default: "2"
permissions:
  contents: write
  issues: read
  pull-requests: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate secret
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
        run: |
          if [ -z "$KIMI_MODEL_API_KEY" ]; then
            echo "::error::Set KIMI_MODEL_API_KEY as a secret in THIS repository (nova-rx). Repository secrets do not transfer from pharmacy."
            exit 1
          fi
      - name: Install Kimi CLI
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh -o /tmp/kimi-install.sh
          bash /tmp/kimi-install.sh
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"
      - name: Implement issue on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_MODEL_NAME: k3-256k
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_MODEL_PROVIDER_TYPE: kimi
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" = "2" || { echo "Only approved issue #2 is enabled"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="kimi/issue-2-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/kimi-task.txt
          kimi -p "Implement the requirements in GitHub issue #2, available at /tmp/kimi-task.txt. Read only necessary repository files. Make narrowly scoped changes, add tests where feasible, preserve Black Edition RTL UX. Do not access secrets or modify workflow files. Do not commit, push, deploy, or merge yourself. Finish with a concise BUILD_REPORT.md in repository root explaining changes, tests, limitations."
          git add -A -- ':!.github/workflows' ':!*.env' ':!*.env.*'
          if git diff --cached --quiet; then
            echo "::error::Kimi produced no changes"
            exit 1
          fi
          git commit -m "fix: address NOVA Rx issue #2 via Kimi"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Kimi: fix POS persistence and blocking UX issues (#2)" --body "Implements #2. Requires independent Grok browser QA and ChatGPT approval before merge."
