name: Kimi NOVA Rx task
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Approved GitHub issue number"
        required: true
        default: "4"
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: kimi-nova-rx
  cancel-in-progress: false
jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'kimi-run-now'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate secret
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
        run: |
          if [ -z "$KIMI_MODEL_API_KEY" ]; then
            echo "::error::Set KIMI_MODEL_API_KEY as a secret in THIS repository (nova-rx). Repository secrets do not transfer from pharmacy."
            exit 1
          fi
      - name: Install Kimi CLI
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh -o /tmp/kimi-install.sh
          bash /tmp/kimi-install.sh
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"
      - name: Implement issue on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_MODEL_NAME: k3-256k
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_MODEL_PROVIDER_TYPE: kimi
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" -ge 1 || exit 1
          LABELS="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')"
          printf '%s\n' "$LABELS" | grep -Fxq kimi-ready || { echo "::error::Issue lacks kimi-ready approval"; exit 1; }
          test -f KIMI_CONTEXT.md || { echo '::error::Missing KIMI_CONTEXT.md'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="kimi/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          # PRs target the branch this run started from (main for label runs,
          # the dispatch ref for workflow_dispatch), so Kimi work can stack on a feature branch.
          BASE_REF="${GITHUB_REF_NAME}"
          START_SHA="$(git rev-parse HEAD)"
          git switch -c "$BRANCH"
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/kimi-task.txt
          kimi -p "Read KIMI_CONTEXT.md FIRST (maximum 120 lines), then /tmp/kimi-task.txt, which is your ONLY task. Do exactly the scope and acceptance criteria in that task; nothing else. Read only the files the task names, in bounded ranges with rg/sed; do not dump index.html or redo repository-wide analysis. Do not repeat failed tool calls. Run the tests the task names and record exact results in BUILD_REPORT.md (new top entry: issue, changed files, tests run and results, remaining work, limitations). Never claim untested success. Keep total work within 12 minutes; stop promptly and leave a useful report. If the task is UI work, preserve Black Edition Arabic RTL UX. No secrets, no network calls to supplier sites, no workflow edits, no node_modules, no deployment, merge, or self-commit. If no work remains, report that and make no changes."

          git add -A -- ':!.github/workflows' ':!*.env' ':!*.env.*' ':!node_modules' ':!kimi-recovery.patch'
          if git diff --cached --quiet; then
            echo "::error::Kimi produced no changes"
            exit 1
          fi
          git commit -m "fix: address NOVA Rx issue #${ISSUE_NUMBER} via Kimi"
          mkdir -p /tmp/kimi-recovery
          git diff --binary "$START_SHA" HEAD -- . ':(exclude).github/workflows/**' ':(exclude)node_modules/**' > /tmp/kimi-recovery/changes.patch
          cp /tmp/kimi-recovery/changes.patch kimi-recovery.patch
          # Rebuild a clean branch from the latest base branch; do not carry workflow history.
          git fetch origin "$BASE_REF"
          git switch -c "${BRANCH}-clean" "origin/$BASE_REF"
          if [ -s /tmp/kimi-recovery/changes.patch ]; then
            git apply --index /tmp/kimi-recovery/changes.patch
          else
            echo "::error::No recoverable non-workflow changes"; exit 1
          fi
          git commit -m "fix: address NOVA Rx issue #${ISSUE_NUMBER} via Kimi (clean)"
          git push origin "${BRANCH}-clean"
          BRANCH="${BRANCH}-clean"
          if ! gh pr create --draft --base "$BASE_REF" --head "$BRANCH" --title "Kimi: implement NOVA Rx issue #${ISSUE_NUMBER}" --body "Implements #${ISSUE_NUMBER}. Requires independent browser QA and owner approval before merge."; then
            echo "::error::Changes pushed to $BRANCH, but GitHub Actions cannot create PR. Open draft PR manually, then re-run only after PR exists."
            echo "PR_CREATE_BLOCKED: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Preserve Kimi work even when push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kimi-recovery.patch
            BUILD_REPORT.md
            HANDOFF.md
            index.html
            README.md
            tests/
          if-no-files-found: warn
          retention-days: 14
