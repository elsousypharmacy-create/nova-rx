name: Kimi NOVA Rx task
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Approved GitHub issue number"
        required: true
        default: "4"
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: kimi-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate secret
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
        run: |
          if [ -z "$KIMI_MODEL_API_KEY" ]; then
            echo "::error::Set KIMI_MODEL_API_KEY as a secret in THIS repository (nova-rx). Repository secrets do not transfer from pharmacy."
            exit 1
          fi
      - name: Install Kimi CLI
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh -o /tmp/kimi-install.sh
          bash /tmp/kimi-install.sh
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"
      - name: Implement issue on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          KIMI_MODEL_NAME: k3-256k
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_MODEL_PROVIDER_TYPE: kimi
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" -ge 1 || exit 1
          gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq kimi-ready || { echo "::error::Issue lacks kimi-ready approval"; exit 1; }
          test -f KIMI_CONTEXT.md || { echo '::error::Missing KIMI_CONTEXT.md'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="kimi/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/kimi-task.txt
          kimi -p "Read KIMI_CONTEXT.md FIRST (maximum 120 lines), then /tmp/kimi-task.txt. Use existing BUILD_REPORT.md only if directly relevant. Work on ONE highest-priority unresolved UX defect or one tightly related pair per run, not the entire issue. Read only bounded sections of necessary files using rg/sed; do not dump full index.html or redo repository-wide analysis. Do not repeat failed tool calls. Make a minimal fix, run targeted tests, and update BUILD_REPORT.md with completed defect IDs, exact test results and remaining IDs. Never claim untested success. Keep total work within 10 minutes; stop promptly and leave a useful report. Preserve Black Edition RTL UX. No secrets, workflow edits, deployment, merge, or self-commit. Do not overwrite prior report history without retaining completed findings. If no work remains, report that and make no changes."

          git add -A -- ':!.github/workflows' ':!*.env' ':!*.env.*'
          if git diff --cached --quiet; then
            echo "::error::Kimi produced no changes"
            exit 1
          fi
          git commit -m "fix: address NOVA Rx issue #${ISSUE_NUMBER} via Kimi"
          mkdir -p /tmp/kimi-recovery
          git diff --binary origin/main HEAD -- . ':(exclude).github/workflows/**' > /tmp/kimi-recovery/changes.patch
          cp /tmp/kimi-recovery/changes.patch kimi-recovery.patch
          git push origin "$BRANCH"
          if ! gh pr create --draft --base main --head "$BRANCH" --title "Kimi: implement NOVA Rx issue #${ISSUE_NUMBER}" --body "Implements #${ISSUE_NUMBER}. Requires independent Grok browser QA and ChatGPT approval before merge."; then
            echo "::warning::Changes pushed to $BRANCH, but GitHub Actions cannot create PR. Open draft PR manually or via connected GitHub app."
            echo "PR_CREATE_BLOCKED: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve Kimi work even when push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimi-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kimi-recovery.patch
            BUILD_REPORT.md
            HANDOFF.md
            index.html
            README.md
            tests/
          if-no-files-found: warn
          retention-days: 14
