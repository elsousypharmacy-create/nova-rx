name: Supplier cart read check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Read live carts and execution journal (no writes)
        env:
          NOVA_API_PIN: ${{ secrets.NOVA_API_PIN }}
          NOVA_WORKER_URL: ${{ secrets.NOVA_WORKER_URL || 'https://nova-rx-preview.elsousypharmacy.workers.dev' }}
        run: node tools/check-supplier-carts.mjs
