# Daily encrypted export of D1 nova-rx-staging as a GitHub Actions artifact (free; no R2).
# Repo is public: artifacts are world-readable, so ONLY the AES-256 ciphertext and a
# manifest (sha256, sizes, row counts, bookmark; no SQL) are uploaded. Runbook:
# docs/ops/backup-restore.md. Never deploys, never restores, never prints secret values.
name: D1 backup

on:
  schedule:
    # 01:00 UTC = 04:00 Asia/Riyadh
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check secret names
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE || secrets.NOVA_INGEST_SECRET }}
        run: |
          [ -n "$CF" ] || { echo "::error::MISSING SECRET: CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$PASS" ] || { echo "::error::MISSING SECRET: BACKUP_PASSPHRASE (or NOVA_INGEST_SECRET)"; exit 1; }
      - name: Export + encrypt
        id: bk
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7140d9b8f71fb0854b43e50172a7146c' }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE || secrets.NOVA_INGEST_SECRET }}
          BACKUP_OUTDIR: ${{ github.workspace }}/artifacts/d1-backup
        run: bash ../scripts/d1-backup.sh nova-rx-staging
      - name: Upload encrypted artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-nova-rx-staging-${{ github.run_id }}
          path: |
            artifacts/d1-backup/*.sql.gz.enc
            artifacts/d1-backup/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
