# Manual, guarded deploy of the NOVA Rx *staging* backend Worker (nova-rx-api-staging only).
# Start it from Actions > "Deploy backend staging" > Run workflow.
# First run should be a dry run (default). A real deploy requires confirm:
#   DEPLOY nova-rx-api-staging
# Never touches nova-rx-preview or production. Uses existing GitHub secrets.
# Auto mode: .nova/cloud_scheduler.py dispatches this with gate_id=GATE-14|15|16 once the
# gate's `after` tasks are done; the result is written back to .nova/cloud-queue.json.
# GATE-17 (live pilot + production) is refused here and stays owner-only.
# Prints secret NAMES only, never values. Feature flags stay OFF.
name: Deploy backend staging
run-name: ${{ inputs.gate_id != '' && format('gate {0} deploy', inputs.gate_id) || 'Deploy backend staging' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = check everything, upload nothing"
        required: true
        type: boolean
        default: true
      confirm:
        description: "For a real deploy type exactly: DEPLOY nova-rx-api-staging"
        required: false
        default: ""
      gate_id:
        description: "Set by cloud-scheduler (GATE-14/15/16). Empty for manual runs."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      result: ${{ steps.res.outputs.result }}
    steps:
      - name: Gate guard
        env:
          GATE: ${{ inputs.gate_id }}
          REF: ${{ github.ref }}
        run: |
          [ -z "$GATE" ] && exit 0
          [ "$REF" = refs/heads/main ] || { echo "::error::gate deploys run from main only"; exit 1; }
          case "$GATE" in GATE-14|GATE-15|GATE-16) ;; *) echo "::error::$GATE is not auto-deployable (GATE-17 is owner-only)"; exit 1;; esac
      - name: Single attempt only
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: '[ "$RUN_ATTEMPT" = "1" ] || { echo "Re-runs are blocked. Start a new run."; exit 1; }'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run backend unit checks
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/unit/backend-*.check.mjs)
          for f in "${files[@]}"; do echo "== $f"; node --no-warnings "$f"; done
          node tools/backend/check-migrations.mjs
          node tools/backend/stale-artifact-guard.mjs 0.1.0
      - name: Guard migrations are additive only
        run: |
          set -euo pipefail
          shopt -s nullglob
          bad=0
          for f in backend/migrations/*.sql; do
            if grep -EinH '\b(DROP[[:space:]]+(TABLE|COLUMN|INDEX|VIEW|TRIGGER)|TRUNCATE|DELETE[[:space:]]+FROM)\b' "$f"; then bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "::error::destructive SQL in a migration (owner review required)"; exit 1; }
      - name: Check the token secret exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '[ -n "$CF_API_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN secret (Settings > Secrets and variables > Actions)."; exit 1; }'
      - name: Encrypted D1 backup + Time Travel bookmark (before migrations)
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7140d9b8f71fb0854b43e50172a7146c' }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE || secrets.NOVA_INGEST_SECRET }}
          BACKUP_OUTDIR: ${{ github.workspace }}/artifacts/d1-backup
        run: bash ../scripts/d1-backup.sh nova-rx-staging
      - name: Upload encrypted pre-deploy backup (30 days)
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: d1-predeploy-nova-rx-staging-${{ github.run_id }}
          path: |
            artifacts/d1-backup/*.sql.gz.enc
            artifacts/d1-backup/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deploy (or dry run)
        env:
          RESULT_FILE: ${{ runner.temp }}/deploy-result.json
          REQUIRE_MIGRATIONS: ${{ inputs.gate_id != '' }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA_API_PIN: ${{ secrets.NOVA_API_PIN }}
          NOVA_INGEST_SECRET: ${{ secrets.NOVA_INGEST_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
          BUILD_SHA: ${{ github.sha }}
          LIVE_URL: https://nova-rx-api-staging.elsousypharmacy.workers.dev
        run: bash .github/scripts/deploy_backend_staging.sh
      - name: Result
        id: res
        if: always()
        env:
          RF: ${{ runner.temp }}/deploy-result.json
        run: |
          [ -s "$RF" ] || echo '{"status":"failed","reason":"deploy stopped before upload"}' > "$RF"
          echo "result=$(jq -c . "$RF")" >> "$GITHUB_OUTPUT"
          jq . "$RF"

  mark-gate:
    needs: deploy
    if: ${{ always() && inputs.gate_id != '' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write gate result to .nova/cloud-queue.json
        env:
          GATE: ${{ inputs.gate_id }}
          RESULT: ${{ needs.deploy.outputs.result }}
          JOB: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 .nova/gate_result.py
            git diff --quiet -- .nova/cloud-queue.json && exit 0
            git commit -qam "chore(queue): $GATE auto-deploy result [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push gate result"; exit 1
