name: Set Worker supplier secrets

# Manual. Copies two GitHub repo secrets (NOVA_API_PIN, NOVA_INGEST_SECRET) onto the live Worker
# nova-rx-preview as Worker secrets, so the supplier API can check them. Uses CLOUDFLARE_API_TOKEN.
# Prints only names and a yes/no, never values. Existing bindings are left alone.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: SET nova-rx-preview secrets"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-nova-worker
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA_API_PIN: ${{ secrets.NOVA_API_PIN }}
          NOVA_INGEST_SECRET: ${{ secrets.NOVA_INGEST_SECRET }}
          CONFIRM: ${{ inputs.confirm }}
          SCRIPT_NAME: nova-rx-preview
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "SET nova-rx-preview secrets" ] || { echo "::error::confirmation text does not match"; exit 1; }
          [ -n "$CF_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ "${#NOVA_API_PIN}" -ge 12 ] || { echo "::error::NOVA_API_PIN must be set and at least 12 characters"; exit 1; }
          [ "${#NOVA_INGEST_SECRET}" -ge 16 ] || { echo "::error::NOVA_INGEST_SECRET must be set and at least 16 characters"; exit 1; }
          API="https://api.cloudflare.com/client/v4"
          cf() { curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ACC="${CF_ACCOUNT_ID:-}"
          if [ -z "$ACC" ]; then ACC="$(cf "$API/accounts" | jq -r '.result[0].id')"; fi
          [ -n "$ACC" ] && [ "$ACC" != "null" ] || { echo "::error::could not find the Cloudflare account"; exit 1; }
          for NAME in NOVA_API_PIN NOVA_INGEST_SECRET; do
            VALUE="${!NAME}"
            BODY="$(jq -n --arg n "$NAME" --arg v "$VALUE" '{name:$n,text:$v,type:"secret_text"}')"
            OK="$(cf -X PUT "$API/accounts/$ACC/workers/scripts/$SCRIPT_NAME/secrets" --data "$BODY" | jq -r '.success')"
            echo "$NAME: $([ "$OK" = "true" ] && echo set || echo FAILED)"
            [ "$OK" = "true" ] || exit 1
          done
          echo "Bindings now on $SCRIPT_NAME (names and types only):"
          cf "$API/accounts/$ACC/workers/scripts/$SCRIPT_NAME/settings" | jq -c '[.result.bindings[] | {name, type}]'
