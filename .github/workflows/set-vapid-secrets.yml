name: Set Web Push (VAPID) keys on the staging API

# Manual. Background Web Push for new WhatsApp messages needs VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY on nova-rx-api-staging.
# Until they exist, GET /api/v1/inbox/history/push/key answers enabled:false and no notification arrives while the app is closed.
# This generates a fresh key pair on the runner (tools/gen-vapid-keys.mjs, files 0600 outside the repo, the private key is never printed),
# sets BOTH as Worker secrets through the Cloudflare API, and prints only names/types. It does nothing when both already exist:
# replacing the keys would invalidate every phone that already subscribed. Uses the same CLOUDFLARE_API_TOKEN as the deploy workflows.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: SET VAPID nova-rx-api-staging"
        required: true

permissions:
  contents: read

concurrency:
  group: set-vapid-secrets
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set the keys (only if missing)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7140d9b8f71fb0854b43e50172a7146c' }}
          CONFIRM: ${{ inputs.confirm }}
          SCRIPT_NAME: nova-rx-api-staging
        run: |
          set -euo pipefail
          set +x
          [ "$CONFIRM" = "SET VAPID nova-rx-api-staging" ] || { echo "::error::confirmation text does not match"; exit 1; }
          [ -n "$CF_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          API="https://api.cloudflare.com/client/v4"
          cf() { curl -sS --max-time 30 -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          bindings() { cf "$API/accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/settings" | jq -c '[.result.bindings[]? | select(.name|test("^VAPID_")) | {name, type}]'; }
          BEFORE="$(bindings)"; echo "before: $BEFORE"
          if [ "$(echo "$BEFORE" | jq 'map(.name)|contains(["VAPID_PUBLIC_KEY","VAPID_PRIVATE_KEY"])')" = "true" ]; then
            echo "Both VAPID keys already exist on $SCRIPT_NAME: left alone (replacing them would drop every subscribed phone)."; exit 0
          fi
          DIR="$(mktemp -d)"; chmod 700 "$DIR"
          node tools/gen-vapid-keys.mjs "$DIR" >/dev/null
          for NAME in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            BODY="$(jq -n --arg n "$NAME" --rawfile v "$DIR/$NAME" '{name:$n,text:$v,type:"secret_text"}')"
            OK="$(cf -X PUT "$API/accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/secrets" --data "$BODY" | jq -r '.success')"
            echo "$NAME: $([ "$OK" = "true" ] && echo set || echo FAILED)"
            [ "$OK" = "true" ] || { rm -rf "$DIR"; exit 1; }
          done
          rm -rf "$DIR"
          echo "after: $(bindings)"
