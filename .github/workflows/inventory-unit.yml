name: Inventory unit checks

on:
  pull_request:
    paths:
      - 'worker/inventory/**'
      - 'tests/unit/inventory-*.check.mjs'
      - 'tests/unit/erp-cycle.check.mjs'
      - '.github/workflows/inventory-unit.yml'
  push:
    branches: [main]
    paths:
      - 'worker/inventory/**'
      - 'tests/unit/inventory-*.check.mjs'
      - 'tests/unit/erp-cycle.check.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run inventory and cycle checks (no dependencies, no network, read-only)
        run: |
          set -euo pipefail
          for f in tests/unit/inventory-*.check.mjs tests/unit/erp-cycle.check.mjs; do echo "== $f"; node --no-warnings "$f"; done
