<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المشتريات — استلام</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">NOVA <b>Rx</b></div>
    <div class="badge">نسخة تجريبية</div>
  </div>
  <div class="page-head">
    <h1>المشتريات</h1>
    <div class="sample-tag"><i></i>بيانات توضيحية</div>
  </div>
  <div class="tabs">
    <div class="tab">طلب</div>
    <div class="tab active">استلام</div>
    <div class="tab">سجل الفواتير</div>
  </div>
  <div class="content">
    <div class="kpis">
      <div class="kpi">
        <div class="num">0.00</div>
        <div class="cap">استلامات اليوم</div>
        <div class="sub">0 فاتورة · بالجنيه</div>
      </div>
      <div class="kpi">
        <div class="num">0</div>
        <div class="cap">طلبات معلّقة</div>
        <div class="sub">من حصة المشتريات</div>
      </div>
      <div class="kpi">
        <div class="num">0</div>
        <div class="cap">أصناف مفيش</div>
        <div class="sub">نواقص لسه مستنية</div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn-ghost btn-sm" style="flex:1">قراءة فاتورة بالصورة</button>
      <button class="btn btn-primary btn-sm" style="flex:1">+ استلام فاتورة</button>
    </div>

    <div class="empty">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 7h18M5 7l2 12h10l2-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
        </svg>
      </div>
      <h2>لسه مفيش استلامات</h2>
      <p>لما الصندوق يوصل، اضغط «استلام فاتورة». أو ارجع للنواقص وابنِ الطلب الأول.</p>
      <button class="btn btn-primary">اطلب من النواقص</button>
    </div>
  </div>
</div>
</body>
</html>
