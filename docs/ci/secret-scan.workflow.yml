name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan committed files (local, no dependencies, never prints values)
        run: |
          set -euo pipefail
          node --no-warnings tests/unit/secret-scan.check.mjs
          node --no-warnings scripts/secret-scan.mjs
