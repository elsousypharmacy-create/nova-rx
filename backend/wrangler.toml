# Staging bindings are real (GATE-11 / GATE-13). Production bindings are real since GATE-17
# (owner approved 2026-11-14). dev ids stay placeholders. Production deploys only via
# .github/workflows/deploy-backend-production.yml (owner-approved, guarded).
# R2 is not used: enabling it requires a Cloudflare billing profile (payment card) and the
# owner declined. Backups are D1 Time Travel + the daily encrypted GitHub artifact workflow
# (docs/ops/backup-restore.md). Do not add r2_buckets bindings.
account_id = "7140d9b8f71fb0854b43e50172a7146c"
name = "nova-rx-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
NOVA_ENV = "dev"
CORS_ALLOW_ORIGINS = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "nova-rx-dev"
database_id = "PLACEHOLDER_D1_DEV_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_KV_DEV_ID"


[env.staging]
name = "nova-rx-api-staging"
workers_dev = true
[env.staging.triggers]
crons = ["* * * * *"]
[env.staging.vars]
NOVA_ENV = "staging"
CORS_ALLOW_ORIGINS = "https://nova-rx-preview.elsousypharmacy.workers.dev"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "nova-rx-staging"
database_id = "6e128d17-749e-4e44-9dee-1bf125486f4b"
migrations_dir = "migrations"
[[env.staging.kv_namespaces]]
binding = "KV"
id = "d93eba4d82a94f099d545983618614e6"

[env.production]
name = "nova-rx-api"
workers_dev = true
[env.production.vars]
NOVA_ENV = "production"
CORS_ALLOW_ORIGINS = "https://nova-rx-preview.elsousypharmacy.workers.dev"
[[env.production.d1_databases]]
binding = "DB"
database_name = "nova-rx-production"
database_id = "0b284ffa-5aa4-431e-a5fd-c0fded92a1af"
migrations_dir = "migrations"
[[env.production.kv_namespaces]]
binding = "KV"
id = "47d469e0972347c3b52dc4a767d1ad44"
