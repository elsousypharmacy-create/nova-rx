# Staging bindings are real (GATE-11 / GATE-13). dev and production ids stay placeholders
# until those environments are created. Do not deploy production without a later owner gate.
# R2 is omitted on staging: the account has not enabled R2 in the Cloudflare dashboard
# (API 10042). After the owner enables R2, create bucket nova-rx-staging and add the binding.
account_id = "7140d9b8f71fb0854b43e50172a7146c"
name = "nova-rx-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
NOVA_ENV = "dev"
CORS_ALLOW_ORIGINS = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "nova-rx-dev"
database_id = "PLACEHOLDER_D1_DEV_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_KV_DEV_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "nova-rx-dev"

[env.staging]
name = "nova-rx-api-staging"
workers_dev = true
[env.staging.vars]
NOVA_ENV = "staging"
CORS_ALLOW_ORIGINS = "https://nova-rx-preview.elsousypharmacy.workers.dev"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "nova-rx-staging"
database_id = "6e128d17-749e-4e44-9dee-1bf125486f4b"
migrations_dir = "migrations"
[[env.staging.kv_namespaces]]
binding = "KV"
id = "d93eba4d82a94f099d545983618614e6"

[env.production]
name = "nova-rx-api"
[env.production.vars]
NOVA_ENV = "production"
CORS_ALLOW_ORIGINS = "https://production.example.invalid"
[[env.production.d1_databases]]
binding = "DB"
database_name = "nova-rx-production"
database_id = "PLACEHOLDER_D1_PRODUCTION_ID"
migrations_dir = "migrations"
[[env.production.kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_KV_PRODUCTION_ID"
[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "nova-rx-production"
