<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-nx-page="compare">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>مقارنة أسعار الموردين — نموذج تجريبي</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,'Segoe UI',Tahoma,sans-serif;background:#0b0d12;color:#e8eaf0;min-height:100vh;padding:24px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:1.4rem;font-weight:800}
.badge{display:inline-block;background:#3a2f0b;color:#f5c542;border:1px solid #6b5714;border-radius:999px;padding:2px 12px;font-size:.75rem;margin:8px 0 20px}
table{width:100%;border-collapse:collapse;background:#12151d;border-radius:14px;overflow:hidden;font-size:.9rem}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #1f2430}
th{background:#181c26;color:#9aa3b5;font-size:.78rem}
tr.best td{background:#10231a}
tr.best td:first-child{box-shadow:inset 3px 0 0 #2ecc71}
.best-tag{color:#2ecc71;font-size:.72rem;font-weight:700}
.miss{color:#e67e22;font-size:.72rem}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px}
button{background:#1d2230;color:#e8eaf0;border:1px solid #2c3344;border-radius:10px;padding:0 18px;min-height:44px;min-width:44px;font-family:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
code{color:#8ab4ff}
</style>
<link rel="stylesheet" href="/ux-tokens.css"><link rel="stylesheet" href="/ux-standalone.css"><style id="NOVA_FIX50">@media (hover:none),(pointer:coarse){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=hidden]):not([type=color]):not([type=button]):not([type=submit]):not([type=image]),textarea,select{font-size:16px!important}}</style><style id="UX325">
/* UX325: no page-level horizontal scroll on phones; table becomes a card list, notice wraps, desktop header stays sticky. */
html[data-nx-page=compare] .wrap{min-inline-size:0}
html[data-nx-page=compare] .badge{display:inline-block;white-space:normal;overflow-wrap:anywhere;max-inline-size:100%}
html[data-nx-page=compare] .pager{flex-wrap:wrap;text-align:center}
html[data-nx-page=compare] .pager #pageInfo{min-inline-size:0;overflow-wrap:anywhere}
@media (min-width:601px){
  html[data-nx-page=compare] .tbl-scroll{overflow:clip}
  html[data-nx-page=compare] thead th{position:sticky;top:0;z-index:1}
}
@media (max-width:600px){
  html[data-nx-page=compare] .tbl-scroll{overflow:visible;border:0;box-shadow:none;border-radius:0}
  html[data-nx-page=compare] table{min-inline-size:0;inline-size:100%;background:transparent}
  html[data-nx-page=compare] table,html[data-nx-page=compare] tbody,html[data-nx-page=compare] tr,html[data-nx-page=compare] td{display:block}
  html[data-nx-page=compare] thead{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  html[data-nx-page=compare] tbody tr{background:var(--nx-bg-panel,#12151d);border:1px solid var(--nx-border-subtle,#1f2430);border-radius:var(--nx-r-3,14px);margin-block-end:var(--nx-sp-3,12px);overflow:hidden}
  html[data-nx-page=compare] tr.best{border-inline-start:3px solid var(--nx-ok,#2ecc71)}
  html[data-nx-page=compare] tr.best td:first-child{box-shadow:none}
  html[data-nx-page=compare] td{display:flex;justify-content:space-between;align-items:baseline;gap:var(--nx-sp-3,12px);padding:var(--nx-sp-2,8px) var(--nx-sp-3,12px);text-align:end;overflow-wrap:anywhere;min-inline-size:0}
  html[data-nx-page=compare] td:last-child{border-bottom:0}
  html[data-nx-page=compare] td::before{content:attr(data-label);flex:0 0 auto;color:var(--nx-text-muted,#9aa3b5);font-size:var(--nx-fs-xs,.75rem);font-weight:600;text-align:start}
  html[data-nx-page=compare] td[data-label="المورد"]{font-weight:700;background:var(--nx-bg-surface,#181c26)}
  html[data-nx-page=compare] tr.best td[data-label="المورد"]{background:color-mix(in srgb,var(--nx-ok,#2ecc71) 18%,var(--nx-bg-panel,#12151d))}
  html[data-nx-page=compare] td[data-label="الصنف"]>span{direction:ltr;unicode-bidi:isolate;text-align:end}
}
</style></head>
<body>
<div class="wrap">
  <h1>مقارنة أسعار الموردين</h1>
  <span class="badge">نموذج تجريبي للقراءة فقط — بيانات تركيبية، بدون أي اتصال أو طلب شراء</span>
  <div class="tbl-scroll"><table>
    <thead><tr>
      <th>المورد</th><th>كود الصنف</th><th>الصنف</th><th>السعر (ج.م)</th>
      <th>الخصم</th><th>السعر بعد الخصم</th><th>المخزون</th><th>آخر تحديث</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="pager">
    <button id="prev">السابق</button>
    <span id="pageInfo"></span>
    <button id="next">التالي</button>
  </div>
</div>
<script type="module">
import { SUPPLIER_OFFER_FIXTURES, compareOffers, paginate } from './worker/supplier-price-service.js';

const ranked = compareOffers(SUPPLIER_OFFER_FIXTURES);
const fmt = new Intl.NumberFormat('ar-EG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateFmt = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'medium' });
const rows = document.getElementById('rows');
const pageInfo = document.getElementById('pageInfo');
let page = 1;
const PAGE_SIZE = 4;

function render() {
  const view = paginate(ranked, page, PAGE_SIZE);
  page = view.page;
  rows.innerHTML = view.items.map(o => `
    <tr class="${o.best ? 'best' : ''}">
      <td data-label="المورد"><span>${o.supplier} ${o.best ? '<span class="best-tag">الأفضل سعرًا</span>' : ''}</span></td>
      <td data-label="كود الصنف"><code>${o.productCode}</code></td>
      <td data-label="الصنف"><span>${o.productName}</span></td>
      <td data-label="السعر (ج.م)">${fmt.format(o.priceEgp)}</td>
      <td data-label="الخصم">${o.discountPct}%</td>
      <td data-label="السعر بعد الخصم"><strong>${fmt.format(o.effectivePriceEgp)}</strong></td>
      <td data-label="المخزون">${o.stock === null ? '<span class="miss">غير متوفر</span>' : o.stock === 0 ? '<span class="miss">نفد</span>' : o.stock}</td>
      <td data-label="آخر تحديث">${o.timestamp ? dateFmt.format(new Date(o.timestamp)) : '<span class="miss">غير معروف</span>'}</td>
    </tr>`).join('');
  pageInfo.textContent = `صفحة ${view.page} من ${view.pages} — ${view.total} عرضًا`;
  document.getElementById('prev').disabled = view.page <= 1;
  document.getElementById('next').disabled = view.page >= view.pages;
}
document.getElementById('prev').addEventListener('click', () => { page--; render(); });
document.getElementById('next').addEventListener('click', () => { page++; render(); });
render();
</script>
</body>
</html>
