<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Rx | WhatsApp</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg-base:#08090b;--bg-panel:#111418;--bg-surface:#1b2026;--border-subtle:#2a3037;--text-main:#f1f3f5;--text-muted:#a4adb7;--accent-cyan-light:#76b8d5;--accent-green:#60b99b;--bg:var(--bg-base);--pane:var(--bg-panel);--top:var(--bg-surface);--line:var(--border-subtle);--text:var(--text-main);--muted:var(--text-muted);--green:var(--accent-green)}*{box-sizing:border-box}body{margin:0;background:var(--bg-base);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-cyan-light);outline-offset:2px}.shell{display:grid;grid-template-columns:380px minmax(0,1fr);height:100dvh;max-width:1700px;margin:auto;border-inline:1px solid var(--line)}aside{background:var(--pane);border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column}.toolbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--top);gap:12px}.brand{font-weight:800;letter-spacing:.2px}.brand span{color:var(--green)}.sub{font-size:12px;color:var(--muted)}.search{padding:12px;border-bottom:1px solid var(--line)}input,textarea{border:0;background:var(--bg-surface);color:var(--text);border-radius:9px;padding:12px;min-height:44px;width:100%}input::placeholder,textarea::placeholder{color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}.chip{border:0;border-radius:22px;padding:0 14px;min-height:44px;background:var(--bg-surface);color:#c6d1d6;font-size:13px}.chip.active{background:#173a31;color:#8fd9bf}.chats{overflow:auto;flex:1}.chat{min-height:44px;display:flex;gap:12px;padding:15px 14px;border:0;border-bottom:1px solid #202d33;background:transparent;color:inherit;width:100%;text-align:right}.chat:hover,.chat.selected{background:var(--bg-surface)}.avatar{width:45px;height:45px;flex:0 0 45px;border-radius:50%;display:grid;place-items:center;background:#36505a;color:#fff;font-weight:700}.chatmain{flex:1;min-width:0}.chatline{display:flex;justify-content:space-between;gap:8px}.chatname{font-weight:650}.time,.preview{color:var(--muted);font-size:12px}.preview{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:6px}.count{background:var(--green);color:#09251e;border-radius:30px;padding:1px 6px;font-size:12px}.conversation{display:flex;flex-direction:column;min-width:0;background-color:#0b141a;background-image:radial-gradient(#17252d 1px,transparent 1px);background-size:24px 24px}.header{height:68px;background:var(--top);display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}.headertext{flex:1;min-width:0}.headertext strong,.headertext small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headertext small{color:var(--muted);font-size:12px;margin-top:3px}.action{border:1px solid #3f6b5c;color:#c4f1e2;background:#173a31;border-radius:8px;padding:0 14px;min-height:44px;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}.back{display:none}.applink{display:inline-flex}.messages{flex:1;overflow:auto;padding:24px 7%;display:flex;flex-direction:column;gap:8px}.bubble{max-width:min(72%,530px);padding:9px 11px;border-radius:9px;line-height:1.6;overflow-wrap:anywhere;box-shadow:0 1px 1px #0003}.bubble.in{background:var(--bg-surface);align-self:flex-start;border-top-right-radius:2px}.bubble.out{background:#005c4b;align-self:flex-end;border-top-left-radius:2px}.bubble .meta{display:block;color:#aab7b7;text-align:left;font-size:12px;margin-top:3px}.day{align-self:center;background:#18272f;padding:5px 12px;border-radius:8px;color:#b2bec4;font-size:12px;margin:10px}.composer{display:flex;gap:10px;align-items:end;background:var(--top);padding:12px 18px}.composer textarea{resize:none;min-height:44px;max-height:130px}.send{border:0;background:var(--green);color:#06241d;border-radius:50%;height:44px;width:44px;flex-shrink:0;display:grid;place-items:center}.send svg{width:22px;height:22px}.empty{display:grid;place-content:center;place-items:center;flex:1;text-align:center;padding:24px;color:var(--muted)}.empty h2{color:var(--text)}.notice{background:#1b2026;color:#d5d9ca;font-size:12px;text-align:center;padding:7px}.hidden{display:none!important}.tag{color:#8fd9bf;font-size:12px}.muted{color:var(--muted)}@media(max-width:760px){.shell{display:block}.shell aside,.shell .conversation{height:100dvh}.shell.mobile-open aside{display:none}.shell:not(.mobile-open) .conversation{display:none}.back{display:inline-flex}.toolbar{height:62px}.messages{padding:15px 4%}.bubble{max-width:85%}.header{padding:8px}}
</style></head><body><div class="shell" id="shell">
<aside><div class="toolbar"><div><div class="brand">NOVA <span>Rx</span> · واتساب</div><div class="sub">صندوق المحادثات</div></div><a class="action applink" id="appBack" href="/" aria-label="رجوع للتطبيق">رجوع للتطبيق</a></div><div class="search"><input id="search" aria-label="بحث في المحادثات" placeholder="ابحث عن اسم أو رسالة"></div><div class="filters" id="filters"><button class="chip active" data-filter="all">الكل</button><button class="chip" data-filter="unread">غير مقروء</button><button class="chip" data-filter="human">مع الموظف</button><button class="chip" data-filter="bot">مع البوت</button></div><div class="chats" id="chats"></div></aside>
<section class="conversation"><div id="empty" class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><h2>محادثات واتساب</h2><p>اختار محادثة من القائمة للعرض</p><p class="sub">يلزم تسجيل الدخول وتفعيل الاتصال الآمن</p></div><div id="active" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="header"><button class="action back" id="back" aria-label="الرجوع للمحادثات">رجوع</button><div class="avatar" id="avatar">م</div><div class="headertext"><strong id="contact"></strong><small id="status"></small></div><button class="action" id="takeover"></button></div><div class="notice">الرسائل تُرسل فقط بعد التحقق من تسجيل الدخول والصلاحيات</div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="composer" id="compose"><textarea id="draft" aria-label="اكتب رسالة" rows="1" placeholder="اكتب رد الصيدلي..."></textarea><button class="send" aria-label="إرسال الرد" title="إرسال"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5v6.6l11 1.9-11 1.9z" transform="matrix(-1 0 0 1 24 0)"/></svg></button></form></div></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let chats=[],selected=null,filter='all',query='',activeChat=null;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message){document.querySelector('.notice').textContent=message;}
async function api(path,method='GET',body){
 const r=await fetch('/api/whatsapp/'+path,{method,credentials:'same-origin',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j;
}
function renderList(){
 const list=chats.filter(c=>String(c.id).startsWith('wa_')&&(filter==='all'||filter==='unread'&&c.pending||filter==='human'&&c.hold||filter==='bot'&&!c.hold)&&[c.name,c.phone,c.lastText].join(' ').toLowerCase().includes(query));
 $('chats').innerHTML=list.length?list.map(c=>'<button class="chat '+(selected===c.id?'selected':'')+'" data-id="'+safe(c.id)+'"><span class="avatar">'+safe((c.name||'ع')[0])+'</span><span class="chatmain"><span class="chatline"><span class="chatname">'+safe(c.name||'عميل واتساب')+'</span><span class="time">'+safe(c.last||'')+'</span></span><div class="preview">'+safe(c.lastText||'')+'</div><span class="tag">'+(c.hold?'الموظف':'البوت')+'</span></span></button>').join(''):'<div class="empty"><p>لا توجد محادثات واتساب متاحة</p></div>';
 $('chats').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openChat(b.dataset.id));
}
async function refresh(){
 try{const j=await api('chats');chats=j.chats||[];renderList();notice('متصل بنظام المحادثات');}
 catch(e){chats=[];renderList();notice('الاتصال غير متاح: '+e.message);$('compose').querySelector('button').disabled=true;}
}
async function openChat(id){
 if(!/^wa_[A-Za-z0-9_.-]{1,100}$/.test(id))return;
 try{const j=await api('chats/'+encodeURIComponent(id));selected=id;activeChat=j;$('shell').classList.add('mobile-open');$('empty').classList.add('hidden');$('active').classList.remove('hidden');$('contact').textContent=j.name||'عميل واتساب';$('avatar').textContent=(j.name||'ع')[0];$('status').textContent=j.hold?'الموظف مستلم المحادثة':'البوت مسؤول عن المحادثة';$('takeover').textContent=j.hold?'إرجاع للبوت':'استلام المحادثة';$('messages').replaceChildren();for(const m of j.msgs||[]){const div=document.createElement('div');div.className='bubble '+(m.role==='user'?'in':'out');const content=document.createElement('div');content.dir='auto';content.textContent=m.text||'';const meta=document.createElement('span');meta.className='meta';meta.textContent=m.t||'';div.append(content,meta);$('messages').append(div)}$('messages').scrollTop=$('messages').scrollHeight;$('compose').querySelector('button').disabled=false;renderList();}
 catch(e){notice('تعذّر فتح المحادثة: '+e.message)}
}
$('search').oninput=e=>{query=e.target.value.toLowerCase().trim();renderList()};
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('filters').querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderList()};
$('back').onclick=()=>$('shell').classList.remove('mobile-open');
$('takeover').onclick=async()=>{if(!selected||!activeChat)return;try{await api('chats/'+encodeURIComponent(selected)+'/hold','POST',{hold:!activeChat.hold});await openChat(selected);await refresh()}catch(e){notice('تعذّر تغيير المسؤول: '+e.message)}};
$('compose').onsubmit=async e=>{e.preventDefault();const text=$('draft').value.trim();if(!selected||!text)return;const btn=$('compose').querySelector('button');btn.disabled=true;try{await api('chats/'+encodeURIComponent(selected)+'/reply','POST',{text});$('draft').value='';await openChat(selected);await refresh()}catch(e){notice('لم يتم إرسال الرد: '+e.message)}finally{btn.disabled=false}};
$('compose').querySelector('button').disabled=true;refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></body></html>
