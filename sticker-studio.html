<main>
<section class="hero"><div><h1>استيكرات الأدوية</h1></div><nav class="stepper" aria-label="مراحل العمل"><span class="step active">١ المريض</span><span class="step active">٢ الأدوية</span><span class="step">٣ مراجعة</span><span class="step">٤ طباعة</span></nav></section><div class="layout">
  <section class="panel"><div class="panel-head"><div><h2>المريض والأدوية</h2></div><button class="btn small danger" id="clearDraft" type="button">مسح المسودة</button></div><div class="panel-body">
    <details class="extras"><summary>فواتير سابقة</summary><div class="queue" id="invoiceQueue"></div></details>
    <div class="grid2 compact-patient">
      <label class="field"><span>اسم المريض</span><input id="patientName" autocomplete="off" placeholder="اختياري"></label>
      <label class="field optional-field"><span>رقم الهاتف</span><input id="patientPhone" inputmode="tel" dir="ltr" autocomplete="off" placeholder="اختياري"></label>
      <label class="field optional-field"><span>العمر</span><input id="patientAge" autocomplete="off" placeholder="مثال: 8 سنوات"></label>
      <label class="field optional-field"><span>الوزن</span><input id="patientWeight" inputmode="decimal" dir="ltr" placeholder="كجم"></label>
      <label class="field optional-field"><span>حساسية / حالة خاصة</span><select id="patientSafety"><option value="">غير محدد</option><option value="child">طفل</option><option value="pregnant">حامل</option><option value="breastfeeding">مرضعة</option><option value="chronic">مرض مزمن يحتاج مراجعة</option></select></label>
      <label class="field"><span>اسم الدواء اليدوي</span><input id="manualMedicine" autocomplete="off" placeholder="اكتب الدواء ثم أضفه"></label>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0 10px"><strong>أدوية الاستيكرات</strong><button class="btn small" id="addMedicine" type="button">إضافة دواء</button></div>
    <div class="med-list" id="medicineList"></div>
    <div class="approval" style="margin-top:14px"><input id="pharmacistApproval" type="checkbox"><label for="pharmacistApproval">أنا الصيدلي راجعت كل دواء والجرعات والتعليمات وأوافق على الطباعة.</label></div>
  </div></section>
  <section class="preview-shell"><div class="panel settings"><div class="panel-head"><div><h2>الطباعة</h2></div><button class="btn small" id="resetSettings" type="button">استعادة الافتراضي</button></div><div class="panel-body">

      <label class="field advanced-print"><span>الورق</span><select id="paperLayout"><option value="single">ملصق فردي</option><option value="split">ورق مقسوم</option></select></label>

      <label class="field"><span>عدد النسخ</span><input id="copies" type="number" min="1" max="50" value="1"></label>
      <label class="field advanced-print"><span>الهامش mm</span><input id="marginMm" type="number" min="0" max="10" step="0.5" value="2"></label>
      <label class="field advanced-print"><span>اتجاه الورق</span><select id="orientation"><option value="auto">تلقائي</option><option value="portrait">طولي</option><option value="landscape">عرضي</option></select></label>
      <label class="field advanced-print"><span>اختبار الطابعة</span><button class="btn" id="testPrint" type="button">طباعة اختبار</button></label>
    </div>
    <details style="margin-top:8px"><summary>خيارات الأمان والطباعة</summary><div class="details-body"><label class="check"><input id="showReviewBadge" type="checkbox" checked> إظهار علامة “يتطلب مراجعة” على المسودات الناقصة</label><label class="check" style="margin-top:8px"><input id="includePhone" type="checkbox" checked> إظهار رقم الصيدلية أسفل الاستيكر</label></div></details>
  </div></div>
  <div class="preview-toolbar"><div><strong>معاينة الاستيكر</strong><div class="split-note" id="sizeNote"></div></div><div style="display:flex;gap:8px"><button class="btn" id="printSelected" type="button">طباعة المحدد</button><button class="btn primary" id="printAll" type="button">طباعة الكل</button></div></div>
  <div class="preview-grid" id="previewGrid"></div>
  </section>
</div>
</main>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const PRESETS=[['50x30',50,30],['40x30',40,30],['40x25',40,25],['50x25',50,25],['58x40',58,40],['60x40',60,40],['70x50',70,50],['100x50',100,50],['custom',null,null]];
const DRAFT_KEY='nova.stickerStudio.draft.v1';
const SETTINGS_KEY='nova.stickerStudio.settings.v1';
const QUEUE_KEY='nova.label.invoices.v1';
const LOGO='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA4KCw0LCQ4NDA0QDw4RFiQXFhQUFiwgIRokNC43NjMuMjI6QVNGOj1OPjIySGJJTlZYXV5dOEVmbWVabFNbXVn/2wBDAQ8QEBYTFioXFypZOzI7WVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVn/wAARCABOAFADASIAAhEBAxEB/8QAGwAAAgIDAQAAAAAAAAAAAAAAAAYEBQECBwP/xAA0EAABAwIEAwQKAQUAAAAAAAABAAIDBAUGESExEkFRE2GBkRQiMkJSYnGx0eEjFRZDocH/xAAZAQADAQEBAAAAAAAAAAAAAAADBAUCAAH/xAAiEQACAgEEAgMBAAAAAAAAAAABAgADEQQSITETIkFRYTL/2gAMAwEAAhEDEQA/AOkIWFldOghCpL7exQDsKfJ1SRqTqGftbRC5wJiyxa13NLOqrKejZxVEzYwdgTqfoFTT4rpmOIhgkk73ENCVJppJ5TJM8ved3OOqGQyyDNkUjh3NJT66VAPbmTH1rsfTiMjcW6+tR6d0n6VjR4hoapwYXGGQ7CTQHxSQWlpIIII5FYWm0tZ64mF1loPPM6ehK2GLpIZRRTuLmkfxuPLuTSp9lZrbBlSq0WLuEEIQhwsiXOsbQ0Mk51cBk0dXHZLNBh+qrnmorXuia88Rz9t34VliS5MpTFDG0OqB67SRmGcs8uu6kYaqDUWscby+Rr3B5cczvn/1NLurq3L8xJ9lt2xviSaS00NIB2UDS743jiP+1O2GQQqvEV3ZZbVLUuyMp9WJp95x2/PglySx5jYVVHAxNrzbI6+kfk0CdozY4b59EhKBasU3O2zl3bGeJ7i58UpzBJ3yPJMTLzhm5ZzVJmoZzq9gByJ7sgR9k7U5qGG5ER1FPlO5e55WWOSW7Uwj3a8OPcBuugrmlbiyGjY6CwU/ZB2jqmUZvP0B28fJSMD4hlNxkoq6d8npJ4o3yOzIf08R9kO/Nnt9QumTxDaezOhoQhKRuJuKoHsuYmIzZIwZHvG4VZQV89vn7SBwyOjmnZwT5XUUNfTGGcaHUEbtPUJNuNjq6ElwYZoeT2DPzHJUaLVZdjSVqKXR/IsYaPElFM0CYmnf82o81YTwUd0pTHMyKphdyOTh+lzpbxyyRO4onuY7q05Lm0i9qcTk1rDhhmS73gN7eKW0ScY37CQ6+Dvz5pMqaaaklMVTE+GQbteMin2kxHXU+Qkc2dvR418wva41EuIpKNlDWNoZon8T2SD29tjzy1071grYn9ciMLdXZ1wYnWfDVyu7g6GExwHeaTRvh18F0Ox4Ut9o4ZeH0iqH+WQbH5Ry+6vgMgAspVrC0aVAIIWDtpuqmsbe3kmmfSsbyAzJ8yFlV3HvE522jOMy3QlcXi6W6UNuUHFGeeWR8CNFf0ddT10Ikp3hw5jm36haepkGfiYruVzgd/U86u10dZmZoGlx94aHzCoqzCrm5uo5uL5JND5pqQvUudOjOeit+xOaVEEtNKYp43MeNwVoDkQRoRseicMWU7H24TkDtI3gA88jyScqdVnkXMkX1eJ9sesP3B1fQfynOaI8Lj16FWqVMHl3b1Q93hb55lNam3qFsIEraZy9YJghCEGHmksTJ43RysD2O0LXDMFK1xtU1ok9Nt8jxGPaAOrPr1CbFggOBaQCDoQUSuwofyBtpFg/fuLNLivIBtXASfjj/BU/+5LdwcXHJn04DmotwwxFI50lHIISdeB2rfDolmppX0shZIWkj4SnFqpt5WIvdfTw0sb3e/6kGxRsMcLTnru4qnyUqhoJa6URxOY0nm4lNlrw/BQuEszu3mGxI9Vv0CKzpSuIFa7NQ24zbDtA6ioOKVvDLKeJw6DkFboQpjsWYsZXRAihRP/Z';
const state={patient:{name:'',phone:'',age:'',weight:'',safety:''},medications:[],approved:false,selectedInvoice:null};
const settings={preset:'50x30',customWidth:50,customHeight:30,paperLayout:'single',styleMode:'full',copies:1,marginMm:2,orientation:'auto',showReviewBadge:true,includePhone:true};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
function toast(msg,type='info'){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast'+(type==='err'?' err':'');el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3400)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function blankMedication(name=''){return{id:uid(),name, dose:'',frequency:'',duration:'',instructions:'',warnings:[],missing:['dose','frequency','duration','instructions'],complete:false,reviewRequired:true,aiStatus:'idle',aiError:'',selected:true}}
function normalizeMedication(med){const required=['dose','frequency','duration','instructions'];med.name=clean(med.name);for(const k of required)med[k]=clean(med[k]);med.warnings=Array.isArray(med.warnings)?med.warnings.map(clean).filter(Boolean).slice(0,8):[];med.missing=required.filter(k=>!med[k]);med.complete=med.missing.length===0;med.reviewRequired=true;return med}
function persist(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({patient:state.patient,medications:state.medications,approved:false,selectedInvoice:state.selectedInvoice}))}catch(e){}}
function persistSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(d){Object.assign(state.patient,d.patient||{});state.medications=Array.isArray(d.medications)?d.medications.map(m=>normalizeMedication({...blankMedication(),...m,id:m.id||uid(),aiStatus:'idle',aiError:'',reviewRequired:true})):[];state.selectedInvoice=d.selectedInvoice??null}}catch(e){}try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch(e){}if(!state.medications.length)state.medications.push(blankMedication());}
function getQueue(){try{const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');return Array.isArray(q)?q.slice(0,20):[]}catch(e){return[]}}
function renderQueue(){const q=getQueue();$('invoiceQueue').innerHTML=q.length?q.map((inv,i)=>`<button type="button" class="queue-card ${state.selectedInvoice===i?'active':''}" data-invoice="${i}"><strong>${esc(inv.id||('فاتورة '+(i+1)))}</strong><small>${esc(inv.customer||'عميل نقدي')} · ${Array.isArray(inv.items)?inv.items.length:0} صنف</small></button>`).join(''):'<div class="empty" style="width:100%">لا توجد فواتير محفوظة. يمكنك إضافة دواء يدويًا.</div>'}
function patientPayload(){return{age:state.patient.age,weightKg:state.patient.weight,pregnancy:state.patient.safety==='pregnant',breastfeeding:state.patient.safety==='breastfeeding'}}
function medicationPayload(med){return{name:med.name,prescribedDose:med.dose,prescribedFrequency:med.frequency,prescribedDuration:med.duration}}
function medStatus(med){if(med.aiStatus==='loading')return['warn','جاري التوليد'];if(med.aiStatus==='error')return['err','فشل AI'];if(med.complete)return['ok','مكتمل'];return['warn','يحتاج مراجعة']}
function renderMeds(){const box=$('medicineList');box.innerHTML=state.medications.map((m,i)=>{const[cls,label]=medStatus(m);return`<article class="med-card" data-id="${m.id}"><div class="med-top"><div class="med-title"><strong>${i+1}. ${esc(m.name||'دواء بدون اسم')}</strong><small>${m.complete?'جاهز بعد موافقة الصيدلي':'أكمل الحقول الناقصة يدويًا أو عبر AI'}</small></div><span class="status ${cls}">${label}</span></div><div class="grid2"><label class="field"><span>اسم الدواء</span><input data-field="name" value="${esc(m.name)}"></label><label class="field"><span>الجرعة</span><input data-field="dose" value="${esc(m.dose)}" placeholder="لا تخمن الجرعة"></label><label class="field"><span>التكرار</span><input data-field="frequency" value="${esc(m.frequency)}"></label><label class="field"><span>المدة</span><input data-field="duration" value="${esc(m.duration)}"></label></div><label class="field"><span>تعليمات الاستعمال</span><textarea data-field="instructions" placeholder="اكتب فقط التعليمات المؤكدة">${esc(m.instructions)}</textarea></label>${m.missing.length?`<div class="missing">${m.missing.map(x=>`<span>ناقص: ${({dose:'الجرعة',frequency:'التكرار',duration:'المدة',instructions:'التعليمات'})[x]}</span>`).join('')}</div>`:''}${m.aiError?`<div class="status err">${esc(m.aiError)}</div>`:''}<div class="med-actions"><button class="btn small" data-action="ai" ${m.aiStatus==='loading'?'disabled':''}>${m.aiStatus==='loading'?'جاري التوليد…':'إعادة توليد AI'}</button><button class="btn small" data-action="duplicate">تكرار</button><button class="btn small danger" data-action="delete">حذف</button></div></article>`}).join('');persist();renderPreview();updateSteps()}
function updateSteps(){const hasMeds=state.medications.some(m=>m.name);const aiTouched=state.medications.some(m=>m.aiStatus!=='idle'||m.complete);const complete=state.medications.length&&state.medications.every(m=>m.complete);document.querySelectorAll('.step').forEach(s=>{const k=s.dataset.step;s.classList.toggle('active',(k==='patient')||(k==='meds'&&hasMeds)||(k==='ai'&&aiTouched)||(k==='review'&&complete)||(k==='print'&&complete&&state.approved))})}
function dimensions(){if(settings.preset==='custom')return[Number(settings.customWidth)||50,Number(settings.customHeight)||30];const p=PRESETS.find(x=>x[0]===settings.preset)||PRESETS[0];return[p[1],p[2]]}
function labelHtml(med){const lines=[med.dose,med.frequency,med.duration,med.instructions].filter(Boolean).join(' — ');return`<div class="label-inner"><div class="label-brand"><img src="${LOGO}" alt=""><div><strong>صيدلية السوسي</strong><small>د. أحمد السوسي</small></div></div>${state.patient.name?`<div class="patient">المريض: ${esc(state.patient.name)}</div>`:''}<div class="med">${esc(med.name||'اسم الدواء')}</div><div class="instruction">${esc(lines||'تعليمات الاستعمال تُراجع هنا')}</div><div class="warning">${med.complete?'راجع الصيدلي قبل الاستعمال':'مسودة غير مكتملة — مراجعة الصيدلي إلزامية'}${settings.includePhone?' · 01143404023':''}</div>${settings.showReviewBadge&&!med.complete?'<div class="review">يتطلب مراجعة</div>':''}</div>`}
function renderPreview(){const[w,h]=dimensions();$('sizeNote').textContent=`المقاس الحالي: ${w} × ${h} مم · ${settings.paperLayout==='split'?'ورق مقسوم':'ملصق فردي'} · ${settings.styleMode==='compact'?'مختصر':'كامل'}`;$('previewGrid').innerHTML=state.medications.filter(m=>m.selected!==false).map(m=>`<div class="sticker-preview ${settings.styleMode==='compact'?'compact':''}" style="width:${w}mm;height:${h}mm;--pad:${Math.min(settings.marginMm,3)}mm">${labelHtml(m)}</div>`).join('')}
function validateBeforePrint(selectedOnly){const meds=state.medications.filter(m=>m.selected!==false);if(!meds.length){toast('لا توجد أدوية للطباعة','err');return null}if(!state.approved){toast('موافقة الصيدلي إلزامية قبل الطباعة','err');$('pharmacistApproval').focus();return null}const incomplete=meds.filter(m=>!m.complete);if(incomplete.length){toast('أكمل الجرعة والتكرار والمدة والتعليمات قبل الطباعة','err');return null}return meds}
function printPage(meds,test=false){const[w0,h0]=dimensions();const landscape=settings.orientation==='landscape'||(settings.orientation==='auto'&&w0>h0);const w=landscape?Math.max(w0,h0):Math.min(w0,h0);const h=landscape?Math.min(w0,h0):Math.max(w0,h0);const repeated=[];for(let i=0;i<Math.max(1,Math.min(50,Number(settings.copies)||1));i++)repeated.push(...meds);const body=repeated.map((m,i)=>`<div class="label ${settings.styleMode==='compact'?'compact':''} ${test?'test':''}">${test?'<div class="label-inner"><div class="label-brand"><strong>NOVA Rx Print Test</strong></div><div class="med">اختبار مقاس '+w+' × '+h+' mm</div><div class="instruction">إذا ظهر هذا الإطار داخل الملصق فالإعدادات صحيحة.</div><div class="warning">'+new Date().toLocaleString('ar-EG')+'</div></div>':labelHtml(m)}</div>`).join('');const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طباعة استيكرات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>@page{size:${w}mm ${h}mm;margin:${settings.marginMm}mm}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Cairo,Tahoma}.label{width:${w-(settings.marginMm*2)}mm;height:${h-(settings.marginMm*2)}mm;overflow:hidden;break-after:page;direction:rtl}.label.compact{font-size:8.5pt}.label-inner{height:100%;display:flex;flex-direction:column;padding:1mm}.label-brand{display:flex;align-items:center;gap:2mm;border-bottom:.35mm solid #a9b4bd;padding-bottom:1.2mm;margin-bottom:1.5mm}.label-brand img{width:8mm;height:8mm;object-fit:contain}.label-brand strong{font-size:9pt;color:#14365f}.patient{font-size:7.5pt}.med{font-size:11pt;font-weight:900;margin:1mm 0}.instruction{font-size:8pt;line-height:1.65;white-space:pre-wrap}.warning{margin-top:auto;border-top:.25mm dashed #9aa4ad;padding-top:1mm;font-size:6.2pt}.review{display:none}@media screen{body{background:#ddd}.label{background:#fff;margin:10px auto;box-shadow:0 2px 10px #999}}</style></head><body>${body}<script>setTimeout(()=>print(),350)<\/script></body></html>`;const win=window.open('','_blank');if(!win){toast('اسمح بفتح نافذة الطباعة من المتصفح','err');return}win.document.open();win.document.write(html);win.document.close();win.focus()}
async function generateForMedication(med){if(!clean(med.name)){med.aiStatus='error';med.aiError='اكتب اسم الدواء قبل التوليد';renderMeds();return}med.aiStatus='loading';med.aiError='';renderMeds();try{const res=await fetch('/api/ai/medication-label',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({medication:medicationPayload(med),patient:patientPayload(),locale:'ar-EG'})});const data=await res.json().catch(()=>({}));if(!res.ok||data.ok===false&&!data.instruction&&!data.draft)throw new Error(data.error||'تعذر توليد التعليمات');const src=data.instruction||data.draft||data;med.dose=clean(src.dose)||med.dose;med.frequency=clean(src.frequency)||med.frequency;med.duration=clean(src.duration)||med.duration;med.instructions=clean(src.instructions)||med.instructions;med.warnings=Array.isArray(src.warnings)?src.warnings:med.warnings;normalizeMedication(med);med.aiStatus=med.complete?'done':'error';med.aiError=med.complete?'':'الرد غير مكتمل؛ أكمل الحقول الناقصة يدويًا'}catch(e){med.aiStatus='error';med.aiError=e.message||'فشل الاتصال بخدمة AI'}renderMeds()}
function bind(){['patientName','patientPhone','patientAge','patientWeight','patientSafety'].forEach(id=>$(id).addEventListener('input',()=>{state.patient={name:$('patientName').value,phone:$('patientPhone').value,age:$('patientAge').value,weight:$('patientWeight').value,safety:$('patientSafety').value};persist();renderPreview()}));
$('preset').innerHTML=PRESETS.map(([id,w,h])=>`<option value="${id}">${id==='custom'?'مقاس مخصص':`${w} × ${h} مم`}</option>`).join('');$('preset').value=settings.preset;for(const[id,key,type]of[['preset','preset','value'],['customWidth','customWidth','number'],['customHeight','customHeight','number'],['paperLayout','paperLayout','value'],['styleMode','styleMode','value'],['copies','copies','number'],['marginMm','marginMm','number'],['orientation','orientation','value']]){$(id).addEventListener('change',()=>{settings[key]=type==='number'?Number($(id).value):$(id).value;if(key==='preset'){const custom=settings.preset==='custom';$('customWidth').disabled=$('customHeight').disabled=!custom}persistSettings();renderPreview()})}
$('showReviewBadge').addEventListener('change',()=>{settings.showReviewBadge=$('showReviewBadge').checked;persistSettings();renderPreview()});$('includePhone').addEventListener('change',()=>{settings.includePhone=$('includePhone').checked;persistSettings();renderPreview()});
$('addMedicine').onclick=()=>{const name=clean($('manualMedicine').value);state.medications.push(blankMedication(name));$('manualMedicine').value='';renderMeds()};
$('medicineList').addEventListener('input',e=>{const card=e.target.closest('.med-card');if(!card)return;const med=state.medications.find(m=>m.id===card.dataset.id);if(!med)return;med[e.target.dataset.field]=e.target.value;normalizeMedication(med);med.aiStatus='idle';med.aiError='';persist();renderPreview();updateSteps()});
$('medicineList').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const card=e.target.closest('.med-card');const med=state.medications.find(m=>m.id===card.dataset.id);if(!med)return;if(btn.dataset.action==='delete'){state.medications=state.medications.filter(m=>m.id!==med.id);if(!state.medications.length)state.medications.push(blankMedication());renderMeds()}if(btn.dataset.action==='duplicate'){state.medications.push(normalizeMedication({...med,id:uid(),selected:true}));renderMeds()}if(btn.dataset.action==='ai')generateForMedication(med)});
$('pharmacistApproval').addEventListener('change',()=>{state.approved=$('pharmacistApproval').checked;updateSteps()});
$('invoiceQueue').addEventListener('click',e=>{const btn=e.target.closest('[data-invoice]');if(!btn)return;const idx=Number(btn.dataset.invoice);const inv=getQueue()[idx];if(!inv)return;state.selectedInvoice=idx;state.patient.name=inv.customer==='عميل نقدي'?'':(inv.customer||'');state.medications=(Array.isArray(inv.items)?inv.items:[]).map(item=>blankMedication(item.name||''));if(!state.medications.length)state.medications.push(blankMedication());syncPatientInputs();renderQueue();renderMeds();toast('تم تحميل الفاتورة كمسودة مراجعة')});
$('clearDraft').onclick=()=>{if(!confirm('مسح مسودة الاستيكرات الحالية؟'))return;state.patient={name:'',phone:'',age:'',weight:'',safety:''};state.medications=[blankMedication()];state.approved=false;state.selectedInvoice=null;$('pharmacistApproval').checked=false;syncPatientInputs();renderQueue();renderMeds()};
$('resetSettings').onclick=()=>{Object.assign(settings,{preset:'50x30',customWidth:50,customHeight:30,paperLayout:'single',styleMode:'full',copies:1,marginMm:2,orientation:'auto',showReviewBadge:true,includePhone:true});syncSettingsInputs();persistSettings();renderPreview()};
$('testPrint').onclick=()=>printPage([blankMedication('Test')],true);$('printAll').onclick=()=>{const meds=validateBeforePrint(false);if(meds)printPage(meds)};$('printSelected').onclick=()=>{const meds=validateBeforePrint(true);if(meds)printPage(meds)};$('backToPos').onclick=()=>{location.href='/#sale'};}
function syncPatientInputs(){$('patientName').value=state.patient.name;$('patientPhone').value=state.patient.phone;$('patientAge').value=state.patient.age;$('patientWeight').value=state.patient.weight;$('patientSafety').value=state.patient.safety}
function syncSettingsInputs(){$('preset').value=settings.preset;$('customWidth').value=settings.customWidth;$('customHeight').value=settings.customHeight;$('paperLayout').value=settings.paperLayout;$('styleMode').value=settings.styleMode;$('copies').value=settings.copies;$('marginMm').value=settings.marginMm;$('orientation').value=settings.orientation;$('showReviewBadge').checked=settings.showReviewBadge;$('includePhone').checked=settings.includePhone;const custom=settings.preset==='custom';$('customWidth').disabled=$('customHeight').disabled=!custom}
load();bind();syncPatientInputs();syncSettingsInputs();renderQueue();renderMeds();
})();
</script>
